<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandbox</title>
    <link rel="stylesheet" href="../ui-kit/tokens.css" />
    <link rel="stylesheet" href="./sandbox-help.css" />
    <script type="module" src="./main.ts"></script>
