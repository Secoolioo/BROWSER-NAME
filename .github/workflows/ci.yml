name: CI

on:
  pull_request:
  workflow_call:

permissions: {}

# A newer push to a pull request replaces its running checks; a release run is never
# cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, args: --linux --x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, args: --linux --arm64 }
          - { name: windows-x64, os: windows-2025, args: --win --x64 }
          - { name: windows-arm64, os: windows-11-arm, args: --win nsis --arm64 }
          - { name: macos, os: macos-15, args: --mac --arm64 --x64 -c.mac.identity=- }
    defaults:
      run:
        shell: bash
    env:
      BUILDER_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rpm tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build packages
        working-directory: app
        env:
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          pnpm exec electron-vite build
          # shellcheck disable=SC2086 # the arguments are a list on purpose
          pnpm exec electron-builder --config electron-builder.config.mjs --publish never $BUILDER_ARGS
          find "$PACKAGE_DIR" -maxdepth 1 -type f -printf '%s %f\n' 2>/dev/null || ls -l "$PACKAGE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/packages/*.exe
            ${{ runner.temp }}/packages/*.msi
            ${{ runner.temp }}/packages/*.dmg
            ${{ runner.temp }}/packages/*.zip
            ${{ runner.temp }}/packages/*.AppImage
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.rpm
            ${{ runner.temp }}/packages/*.blockmap
            ${{ runner.temp }}/packages/*.yml

  smoke:
    name: smoke (${{ matrix.name }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux-x64,
              os: ubuntu-24.04,
              packages: linux-x64,
              formats: 'appimage-no-sandbox:*-x86_64.AppImage appimage:*-x86_64.AppImage deb:*-amd64.deb',
            }
          - {
              name: linux-arm64,
              os: ubuntu-24.04-arm,
              packages: linux-arm64,
              formats: 'appimage:*-arm64.AppImage deb:*-arm64.deb',
            }
          - {
              name: windows-x64,
              os: windows-2025,
              packages: windows-x64,
              formats: 'nsis:*-x64-setup.exe msi:*-x64.msi',
            }
          - {
              name: windows-arm64,
              os: windows-11-arm,
              packages: windows-arm64,
              formats: 'nsis:*-arm64-setup.exe',
            }
          - { name: macos-arm64, os: macos-15, packages: macos, formats: 'dmg:*-arm64.dmg' }
          - { name: macos-x64, os: macos-15-intel, packages: macos, formats: 'dmg:*-x64.dmg' }
    defaults:
      run:
        shell: bash
    env:
      FORMATS: ${{ matrix.formats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-${{ matrix.packages }}
          path: ${{ runner.temp }}/packages
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb
          # Ubuntu restricts unprivileged user namespaces; the packages must cope with that.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Install, start and remove each package
        run: |
          for entry in $FORMATS; do
            format="${entry%%:*}"
            pattern="${entry#*:}"
            file=$(find "$RUNNER_TEMP/packages" -maxdepth 1 -name "$pattern" | sort | head -1)
            node tools/package/smoke.ts "$format" "$file"
          done
      - name: Install and start the rpm on Fedora
        if: matrix.name == 'linux-x64'
        run: |
          docker run --rm -v "$RUNNER_TEMP/packages:/packages" fedora:latest bash -c '
            dnf install -y -q /packages/*-x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth >/dev/null &&
            xvfb-run -a /opt/*/lampo --no-sandbox --smoke-test=/packages/rpm-report.json'
          node -e 'const r = require(process.argv[1]); console.log(r); process.exit(r.ok ? 0 : 1)' "$RUNNER_TEMP/packages/rpm-report.json"

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    env:
      E2E_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the test package
        working-directory: app
        env:
          PACKAGE_DIR: ${{ runner.temp }}/e2e
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --config electron-builder.config.mjs --publish never --dir
          case "$RUNNER_OS" in
            Linux) echo "E2E_APP=$PACKAGE_DIR/linux-unpacked/lampo" >> "$GITHUB_ENV" ;;
            Windows) echo "E2E_APP=$PACKAGE_DIR/win-unpacked/lampo.exe" >> "$GITHUB_ENV" ;;
            macOS) echo "E2E_APP=$(ls -d "$PACKAGE_DIR"/mac*/*.app)/Contents/MacOS/$(ls "$(ls -d "$PACKAGE_DIR"/mac*/*.app)/Contents/MacOS")" >> "$GITHUB_ENV" ;;
          esac
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The unpacked test build has no setuid sandbox helper; allow user namespaces instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run end-to-end tests
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm exec playwright test
          else
            pnpm exec playwright test
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: app/test-results
          retention-days: 7

  perf:
    name: perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the package as shipped, unpacked
        working-directory: app
        env:
          PACKAGE_DIR: ${{ runner.temp }}/perf
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --config electron-builder.config.mjs --publish never --dir
          case "$RUNNER_OS" in
            Linux) echo "PERF_APP=$PACKAGE_DIR/linux-unpacked/lampo" >> "$GITHUB_ENV" ;;
            Windows) echo "PERF_APP=$PACKAGE_DIR/win-unpacked/lampo.exe" >> "$GITHUB_ENV" ;;
            macOS)
              bundle=$(find "$PACKAGE_DIR" -maxdepth 2 -name '*.app' | head -1)
              echo "PERF_APP=$bundle/Contents/MacOS/$(basename "$bundle" .app)" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The unpacked build has no setuid sandbox helper; allow user namespaces instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Measure against the bare reference
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node tools/perf/run.ts --app "$PERF_APP" --out perf.json
          else
            node tools/perf/run.ts --app "$PERF_APP" --out perf.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: perf.json
          retention-days: 30

  updater:
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build three test versions that trust a test key; the third fails to start
        working-directory: app
        run: |
          node ../tools/feed/feed.ts keygen "$RUNNER_TEMP/keys"
          export UPDATE_KEYS_DIR="$RUNNER_TEMP/keys"
          case "$RUNNER_OS" in
            Linux) target=(--linux AppImage --x64) ;;
            Windows) target=(--win nsis --x64) ;;
          esac
          for n in 1 2 3; do
            if [ "$n" = 3 ]; then export TEST_BOOT_FAILURE=1; fi
            if [ "$n" != 2 ]; then pnpm exec electron-vite build; fi
            PACKAGE_DIR="$RUNNER_TEMP/v$n" pnpm exec electron-builder --config electron-builder.config.mjs \
              --publish never "${target[@]}" -c.extraMetadata.version="0.0.1-test.$n"
          done
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2t64
          # The AppImage sandbox needs user namespaces; the packages job tests the AppArmor fix.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Update build 1 to build 2, then roll back from build 3
        run: |
          set -- --old "$RUNNER_TEMP/v1" --new "$RUNNER_TEMP/v2" --broken "$RUNNER_TEMP/v3" \
            --old-version 0.0.1-test.1 --new-version 0.0.1-test.2 --broken-version 0.0.1-test.3 \
            --key "$RUNNER_TEMP/keys/private.pem"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node app/tests/updater/run.ts "$@"
          else
            node app/tests/updater/run.ts "$@"
          fi

  linux-repos:
    name: linux-repos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c apt-utils
      - name: Build three releases that carry a test repository key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key 'Test repository <test@example.invalid>' ed25519 sign never
          mkdir -p app/build/keys
          gpg --armor --export >app/build/keys/linux-repo.pub.asc
          cd app
          pnpm exec electron-vite build
          for version in 0.0.1-beta.1 0.0.1-beta.2 0.0.1; do
            PACKAGE_DIR="$RUNNER_TEMP/packages-$version" pnpm exec electron-builder \
              --config electron-builder.config.mjs --publish never --linux deb rpm --x64 \
              -c.extraMetadata.version="$version"
          done
      - name: Install from a file and upgrade through the repositories
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -p "$RUNNER_TEMP/repo-test"
          app/tests/linux-repos/run.sh "$RUNNER_TEMP/repo-test" "$RUNNER_TEMP/packages-0.0.1-beta.1" \
            "$RUNNER_TEMP/packages-0.0.1-beta.2" "$RUNNER_TEMP/packages-0.0.1"

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check authors and trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/check-commits.ts "$BASE_SHA" "$HEAD_SHA"

  workflow-security:
    name: workflow-security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [verify, unit, package, smoke, e2e, perf, updater, linux-repos, commits, workflow-security]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # shellcheck disable=SC2016 # JavaScript template literal
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result));
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
            process.exit(failed.length > 0 ? 1 : 0);
          '
