# Squash-merges an owner pull request once its required checks have passed.
# It runs after every `CI` and `PR title` run, merges with the owner token
# through the REST API and needs no auto-merge setting on the pull request.
# A CI run whose failed jobs never got a runner is run once more first.
# Like auto-pr.yml it always runs in the version stored on main; it never
# checks out or executes branch code.
name: Merge pull request

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- reads run metadata only, never runs branch code
    workflows: [CI, PR title]
    types: [completed]

permissions: {}

concurrency:
  group: merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  rerun:
    name: rerun
    # A job that GitHub never started on a runner tested nothing. The failed
    # jobs run once more and the second result counts, whatever it is.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
    outputs:
      conclusion: ${{ steps.rerun.outputs.conclusion }}
    steps:
      - name: Re-run jobs that never started and wait for the result
        id: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # ci-gate only collects the other jobs; its own failure says nothing.
          failed=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "ci-gate")
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              | "\(.steps | length)\t\(.name)"')
          if [[ -z "$failed" ]] || cut -f1 <<<"$failed" | grep -qv '^0$'; then
            echo "A job failed after it started; the failure stands."
            exit 0
          fi
          echo "Jobs that never got a runner:"
          cut -f2 <<<"$failed"
          gh api -X POST "repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" >/dev/null
          state=""
          until [[ "$state" == "2 completed" ]]; do
            sleep 60
            state=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '"\(.run_attempt) \(.status)"' || true)
          done
          conclusion=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          echo "The second attempt ended with $conclusion."
          echo "conclusion=$conclusion" >>"$GITHUB_OUTPUT"

  merge:
    name: merge
    needs: rerun
    if: >-
      always() &&
      (github.event.workflow_run.conclusion == 'success' || needs.rerun.outputs.conclusion == 'success') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: automation
    permissions: {}
    steps:
      - name: Merge once every required check has passed
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,headRefOid,isCrossRepository,isDraft --jq '.[0] // empty')
          if [[ -z "$pr" ]]; then
            echo "No open pull request for $BRANCH."
            exit 0
          fi
          number=$(jq -r '.number' <<<"$pr")
          if [[ "$(jq -r '.author.login' <<<"$pr")" != "$OWNER" ||
            "$(jq -r '.isCrossRepository' <<<"$pr")" != false ||
            "$(jq -r '.isDraft' <<<"$pr")" != false ]]; then
            echo "Pull request #$number is not an owner pull request that is ready."
            exit 0
          fi
          if [[ "$(jq -r '.headRefOid' <<<"$pr")" != "$HEAD_SHA" ]]; then
            echo "Pull request #$number has newer commits; their checks decide."
            exit 0
          fi
          # The latest run of each required check counts.
          for check in ci-gate pr-title; do
            conclusion=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=$check" \
              --jq '.check_runs | if length == 0 then "missing" else (sort_by(.started_at) | last | .conclusion // "pending") end')
            if [[ "$conclusion" != success ]]; then
              echo "Check $check is $conclusion; the merge waits for it."
              exit 0
            fi
          done
          gh api -X PUT "repos/$REPOSITORY/pulls/$number/merge" -f merge_method=squash -f sha="$HEAD_SHA" >/dev/null
          echo "Merged pull request #$number."
