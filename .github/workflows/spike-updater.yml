name: Spike updater

on:
  push:
    branches: ['spike/updater']

permissions: {}

concurrency:
  group: spike-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Build, serve and update
        run: bash spikes/updater/run.sh
      - name: Collect
        if: always()
        run: |
          mkdir -p spikes/updater/out/meta
          cp spikes/updater/dist/*/latest*.yml spikes/updater/out/meta/ 2>/dev/null || true
          for v in 0.0.1 0.0.2; do cp spikes/updater/dist/$v/*.blockmap "spikes/updater/out/meta/" 2>/dev/null || true; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: updater-${{ matrix.os }}
          path: spikes/updater/out/
          if-no-files-found: warn
