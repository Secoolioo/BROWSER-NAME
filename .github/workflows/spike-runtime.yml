name: Spike runtime

on:
  push:
    branches: ['spike/**']

permissions: {}

concurrency:
  group: spike-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        working-directory: spikes/runtime
        run: npm install --no-audit --no-fund
      - name: Prepare Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Run (Linux)
        if: runner.os == 'Linux'
        working-directory: spikes/runtime
        run: xvfb-run -a npx electron . --spike=all --out=result.json
      - name: Run
        if: runner.os != 'Linux'
        working-directory: spikes/runtime
        run: npx electron . --spike=all --out=result.json
      - name: Summarize
        if: always()
        run: node spikes/runtime/summarize.mjs spikes/runtime/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: spikes/runtime/result.json
          if-no-files-found: warn

  wayland:
    name: reparent (wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        working-directory: spikes/runtime
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y weston
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run under headless Weston
        working-directory: spikes/runtime
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-1 --idle-time=0 &
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-1" ] && break; sleep 0.2; done
          WAYLAND_DISPLAY=wayland-1 npx electron . --ozone-platform=wayland --spike=reparent --out=result.json
      - name: Summarize
        if: always()
        run: node spikes/runtime/summarize.mjs spikes/runtime/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-wayland
          path: spikes/runtime/result.json
          if-no-files-found: warn
