# Runs on maintainer branches. It has no access to secrets; when it
# succeeds, `auto-pr.yml` (always taken from main) opens the pull request.
name: Branch push

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'perf/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'build/**'
      - 'ci/**'
      - 'chore/**'

permissions: {}

concurrency:
  group: branch-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
