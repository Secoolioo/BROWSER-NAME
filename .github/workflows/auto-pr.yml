# Opens a pull request for a maintainer branch after `Branch push`
# succeeded and enables squash auto-merge. This workflow always runs in the
# version stored on main; it never checks out or executes branch code.
name: Open pull request

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- reads run metadata only, never runs branch code
    workflows: [Branch push]
    types: [completed]

permissions: {}

concurrency:
  group: auto-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  open:
    name: open
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: automation
    permissions: {}
    steps:
      - name: Open the pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTHOR_EMAIL: ${{ vars.OWNER_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore)/[a-z0-9._-]+$ ]]; then
            echo "Branch '$BRANCH' does not use a maintainer prefix; nothing to do."
            exit 0
          fi

          number=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            echo "Pull request #$number already exists; auto-merge stays as configured."
            exit 0
          fi

          # Title and description come from the oldest commit on the branch.
          first=$(gh api "repos/$REPOSITORY/compare/main...$HEAD_SHA" --jq '.commits[0].sha')
          message=$(gh api "repos/$REPOSITORY/commits/$first" --jq '.commit.message')
          title=$(printf '%s\n' "$message" | head -n 1)
          body=$(printf '%s\n' "$message" | tail -n +3)
          url=$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body")
          number=${url##*/}
          echo "Opened pull request #$number"

          node_id=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.node_id')
          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
          gh api graphql \
            -f query='mutation($id: ID!, $oid: GitObjectID!, $headline: String!, $email: String!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $id, mergeMethod: SQUASH, expectedHeadOid: $oid,
                commitHeadline: $headline, commitBody: "", authorEmail: $email
              }) { clientMutationId }
            }' \
            -f id="$node_id" -f oid="$HEAD_SHA" -f headline="$title" -f email="$AUTHOR_EMAIL"
          echo "Auto-merge (squash) enabled for #$number"
