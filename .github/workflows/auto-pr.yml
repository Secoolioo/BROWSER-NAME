# Opens a pull request for a maintainer branch after `Branch push`
# succeeded; `merge.yml` merges it once its required checks have passed. This
# workflow always runs in the version stored on main; it never checks out or
# executes branch code.
name: Open pull request

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- reads run metadata only, never runs branch code
    workflows: [Branch push]
    types: [completed]

permissions: {}

concurrency:
  group: auto-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  open:
    name: open
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: automation
    permissions: {}
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore)/[a-z0-9._-]+$ ]]; then
            echo "Branch '$BRANCH' does not use a maintainer prefix; nothing to do."
            exit 0
          fi

          number=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            echo "Pull request #$number already exists."
            exit 0
          fi

          # Title and description come from the oldest commit on the branch.
          first=$(gh api "repos/$REPOSITORY/compare/main...$HEAD_SHA" --jq '.commits[0].sha')
          message=$(gh api "repos/$REPOSITORY/commits/$first" --jq '.commit.message')
          title=$(printf '%s\n' "$message" | head -n 1)
          body=$(printf '%s\n' "$message" | tail -n +3)
          url=$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body")
          echo "Opened $url"
